# Local SQL Server 2022 (Developer edition) for FinSight AI.
#   docker compose up -d       # start
#   docker compose ps          # wait for "healthy"
#   docker compose down        # stop (data kept in the named volume)
#
# MSSQL_SA_PASSWORD is read from ./.env (git-ignored). See .env.example.
# On Apple Silicon this amd64 image runs under Rosetta emulation; enable
# "Use Rosetta for x86_64/amd64 emulation" in Docker Desktop, or start Colima with --vz-rosetta.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: finsight-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"
    ports:
      - "127.0.0.1:1433:1433" # bind to localhost only, not the LAN
    volumes:
      - finsight-sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  finsight-sqldata:
